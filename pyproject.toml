[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb"
version = "0.1.0"
description = "Local RAG knowledge base -- PDF ingestion + Chatbox-compatible proxy"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lin Haokang", email = "khusdasz@gmail.com"},
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=1.0",
    "chromadb>=1.5",
    "pypdf>=4.0",
]

[project.urls]
Source = "https://github.com/khusdasz-cmd/rag-kb"

[tool.setuptools.packages.find]
include = ["rag_kb*"]
